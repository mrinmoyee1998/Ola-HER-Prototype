<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ola HER — Driver App Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ---------- Shell tokens (presenter page) ---------- */
:root{
  --shell-bg:#E9ECF2; --shell-ink:#16213E; --shell-muted:#5B6478; --panel:#FFFFFF; --panel-line:#D9DEE8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --shell-bg:#0B1020; --shell-ink:#E8ECF5; --shell-muted:#9AA3B8; --panel:#161E33; --panel-line:#2A3450; }
}
:root[data-theme="dark"]{ --shell-bg:#0B1020; --shell-ink:#E8ECF5; --shell-muted:#9AA3B8; --panel:#161E33; --panel-line:#2A3450; }
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--shell-bg);color:var(--shell-ink);font-family:Manrope,"Segoe UI",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:2px solid #7FA6FF;outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
.stage{display:flex;gap:40px;justify-content:center;align-items:flex-start;padding:28px 20px 40px;min-height:100%}

/* ---------- Driver app tokens: dark, high-contrast for in-vehicle use ---------- */
.phone{
  --bg:#0F1629; --card:#18213A; --card-2:#1F2A47; --ink:#F2F4F8; --ink-2:#C9CFDC; --muted:#8F99B0; --line:#2A355A;
  --her:#EC8389; --her-soft:rgba(236,131,137,.14); --safe:#34C88A; --safe-soft:rgba(52,200,138,.14); --sos:#E5483F; --warn:#F0B44C; --warn-soft:rgba(240,180,76,.13);
  --map:#151D31; --road:#26314C; --road-edge:#1D2640; --block:#1B2439; --park:#17302B; --water:#182A44;
  width:390px;height:820px;border-radius:46px;background:var(--bg);color:var(--ink);position:relative;overflow:hidden;
  box-shadow:0 0 0 10px #05080F,0 30px 60px -20px rgba(5,8,15,.6);flex:none;
}
.phone.day{ --map:#E8EBF0; --road:#FFFFFF; --road-edge:#D5DAE3; --block:#DCE0E8; --park:#D3E6D6; --water:#D1E0F0; }
.screen{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}
.scroll{overflow-y:auto;flex:1}
.sb{height:44px;display:flex;justify-content:space-between;align-items:center;padding:0 28px;font-size:14px;font-weight:700;flex:none;position:relative;z-index:5}
.sb .sig{display:flex;gap:2px;align-items:flex-end}.sb .sig i{display:block;width:3px;background:currentColor;border-radius:1px}
.ic{flex:none;display:block}
.pad{padding:0 18px}
.row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.grow{flex:1;min-width:0}
.h2{font-size:21px;font-weight:800;letter-spacing:-.015em;margin:0}
.sub{color:var(--muted);font-size:13.5px;line-height:1.45;margin:4px 0 0}
.small{font-size:12.5px;color:var(--muted)}
.topbar{display:flex;align-items:center;gap:12px;padding:6px 16px 14px;flex:none}
.topbar h1{font-size:19px;margin:0;font-weight:800}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:0 0 0 1px var(--line)}

.btn{height:56px;border-radius:16px;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn-go{background:var(--safe);color:#06281A}
.btn-primary{background:var(--ink);color:var(--bg)}
.btn-line{box-shadow:inset 0 0 0 1.5px var(--line);background:var(--card)}
.btn-her{background:var(--her);color:#3A0E12}
.btn-sos{background:var(--sos);color:#fff}
.link{color:#8FB0FF;font-weight:700;font-size:14px}

.sheet{background:var(--card);border-radius:26px 26px 0 0;position:relative;z-index:3;box-shadow:0 -10px 30px rgba(0,0,0,.35)}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:10px auto 8px}
.map{position:relative;overflow:hidden;background:var(--map)}
.map svg{display:block;width:100%;height:100%}
.r-edge{stroke:var(--road-edge);stroke-width:16;fill:none;stroke-linecap:round}
.r{stroke:var(--road);stroke-width:12;fill:none;stroke-linecap:round}
.route{stroke:#7FA6FF;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.day .route{stroke:#2F5BD3}
.maplabel{font-size:10px;font-weight:700;fill:#6E7891;letter-spacing:.02em}
.zone{fill:var(--her);opacity:.22}
.zone-ring{fill:none;stroke:var(--her);stroke-width:1.5;opacity:.6;stroke-dasharray:4 4}

.pill{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;background:var(--card);font-size:13px;font-weight:800;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.dotlive{width:9px;height:9px;border-radius:50%;background:var(--safe);animation:pulse 1.8s infinite}
.dotoff{width:9px;height:9px;border-radius:50%;background:var(--muted)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,200,138,.6)}70%{box-shadow:0 0 0 9px rgba(52,200,138,0)}100%{box-shadow:0 0 0 0 rgba(52,200,138,0)}}
.floating{position:absolute;z-index:4}

.her-mark{font-weight:800;letter-spacing:.06em;font-size:12px;color:var(--her);background:var(--her-soft);border-radius:8px;padding:6px 8px;flex:none}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;padding:5px 9px;border-radius:999px}
.badge.her{background:var(--her-soft);color:var(--her)}
.badge.safe{background:var(--safe-soft);color:var(--safe)}
.badge.neutral{background:var(--card-2);color:var(--ink-2)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;font-size:13px;line-height:1.45;margin-top:12px}
.banner.her{background:var(--her-soft);color:#F6C3C6}
.banner.info{background:rgba(127,166,255,.12);color:#C8D7FF}
.banner.safe{background:var(--safe-soft);color:#A9E9CC}
.banner.warn{background:var(--warn-soft);color:#F6DDA8}

.stat{background:var(--card-2);border-radius:16px;padding:14px;flex:1}
.stat b{font-size:22px;letter-spacing:-.02em;display:block}
.modecard{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:var(--card-2);width:100%;text-align:left;margin-top:12px}

/* Preference options — mirror of the rider's wait meter: honest request-rate estimate */
.opt{display:block;width:100%;text-align:left;padding:14px;border-radius:18px;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line);margin-top:10px}
.opt.on{box-shadow:inset 0 0 0 2px var(--her);background:#1E2340}
.opt.on.any{box-shadow:inset 0 0 0 2px #8FB0FF}
.opt b{font-size:16px}.opt p{margin:6px 0 0;font-size:13px;color:var(--muted);line-height:1.45}
.radio{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 2px #56607C;flex:none}
.radio.on{box-shadow:inset 0 0 0 7px var(--her)}
.any .radio.on{box-shadow:inset 0 0 0 7px #8FB0FF}
.rate{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:12px;font-weight:700;color:var(--ink-2)}
.rate .track{flex:1;height:8px;border-radius:4px;background:var(--bg);position:relative;overflow:hidden}
.rate .fill{position:absolute;inset:0 auto 0 0;border-radius:4px;background:#8FB0FF}
.rate .fill.her{background:repeating-linear-gradient(90deg,var(--her) 0 6px,#C6666C 6px 9px)}
.seg2{display:flex;background:var(--bg);border-radius:12px;padding:4px;margin-top:10px}
.seg2 button{flex:1;padding:11px 6px;border-radius:9px;font-size:13.5px;font-weight:800;color:var(--muted)}
.seg2 button.on{background:var(--card-2);color:var(--ink)}
.group{background:var(--card);border-radius:18px;padding:16px;margin:0 16px 14px;box-shadow:0 0 0 1px var(--line)}
.group h3{margin:0;font-size:15px;font-weight:800}
.switch{width:48px;height:29px;border-radius:15px;background:#3A4566;position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;background:#fff;transition:transform .2s}
.switch.on{background:var(--her)}.switch.on::after{transform:translateX(19px)}
.switch.green.on{background:var(--safe)}
.dim{opacity:.4;pointer-events:none}

/* Request card */
.overlay{position:absolute;inset:0;background:rgba(3,6,14,.6);z-index:20;display:flex;align-items:flex-end;animation:fade .2s}
.overlay .sheet{width:100%;padding-bottom:26px;animation:up .25s ease-out}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(50px);opacity:.4}}
.timer{position:relative;width:54px;height:54px;flex:none}
.timer svg{transform:rotate(-90deg)}
.timer b{position:absolute;inset:0;display:grid;place-items:center;font-size:17px}
.leg{display:flex;gap:12px;padding:8px 0}
.leg .pip{width:10px;height:10px;border-radius:50%;margin-top:5px;flex:none}
.fareline{display:flex;align-items:baseline;gap:10px}
.fareline b{font-size:34px;letter-spacing:-.03em}
.avatar{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:19px;flex:none;background:var(--card-2);color:var(--ink)}
.avatar.f{background:var(--her-soft);color:var(--her)}

/* Searching */
.search-pulse{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:var(--card-2);margin-top:12px}
.spinner{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--safe);animation:spin 1s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* OTP keypad */
.otpboxes{display:flex;gap:10px;justify-content:center;margin:16px 0}
.otpboxes i{font-style:normal;width:52px;height:60px;border-radius:14px;background:var(--bg);display:grid;place-items:center;font-size:26px;font-weight:800;box-shadow:inset 0 0 0 1.5px var(--line)}
.otpboxes.bad i{box-shadow:inset 0 0 0 2px var(--sos);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keys button{height:50px;border-radius:12px;background:var(--card-2);font-size:20px;font-weight:800}

/* Safety + SOS */
.sos-big{width:100%;border-radius:20px;background:var(--sos);color:#fff;padding:18px;display:flex;align-items:center;gap:16px;text-align:left}
.sos-big .ring{width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;font-weight:800;font-size:17px;flex:none}
.sos-big b{font-size:19px;display:block}.sos-big span{font-size:13px;opacity:.9}
.srow{display:flex;align-items:center;gap:12px;padding:13px 0;width:100%;text-align:left}
.srow + .srow{border-top:1px solid var(--line)}
.srow b{display:block;font-size:15px}.srow span{font-size:12.5px;color:var(--muted)}
.sos-screen{background:#9E1F1B;color:#fff}
.sos-pulse{width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;margin:18px auto}
.sos-list{background:rgba(0,0,0,.2);border-radius:16px;padding:6px 14px;margin-top:10px}
.sos-list div{display:flex;gap:10px;align-items:center;padding:10px 0;font-size:14px}
.sos-list div + div{border-top:1px solid rgba(255,255,255,.15)}

.stars{display:flex;gap:8px;justify-content:center;margin:12px 0 2px}
.stars button{color:#3E4866}.stars button.on{color:#F2B21B}
.choice{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.choice button{padding:10px 14px;border-radius:999px;box-shadow:inset 0 0 0 1.5px var(--line);font-size:13.5px;font-weight:700}
.choice button.on{background:var(--ink);color:var(--bg);box-shadow:none}
.progressbar{height:10px;border-radius:5px;background:var(--bg);overflow:hidden;margin-top:10px}
.progressbar i{display:block;height:100%;background:var(--her);border-radius:5px}

.tabbar{display:flex;justify-content:space-around;padding:8px 8px 22px;border-top:1px solid var(--line);background:var(--card);flex:none;position:relative;z-index:6}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted);width:72px}
.tab.on{color:var(--ink)}
.toast{position:absolute;left:16px;right:16px;bottom:112px;z-index:40;background:var(--ink);color:var(--bg);border-radius:14px;padding:13px 16px;font-size:13.5px;font-weight:700;display:flex;gap:10px;align-items:center;transform:translateY(20px);opacity:0;transition:.25s;pointer-events:none}
.toast.show{transform:none;opacity:1}

/* ---------- Presenter panel ---------- */
.panel{width:340px;background:var(--panel);border-radius:20px;padding:20px;box-shadow:0 0 0 1px var(--panel-line);position:sticky;top:24px;flex:none}
.panel h2{margin:0;font-size:17px;font-weight:800}
.panel p{color:var(--shell-muted);font-size:13px;line-height:1.5;margin:6px 0 0}
.panel a{color:#2F5BD3;font-weight:700}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .panel a{color:#8FB0FF} }
.psec{margin-top:18px}.psec > b{font-size:13px;display:block;margin-bottom:8px}
.scen{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.scen button{text-align:left;padding:10px 12px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--panel-line);font-size:12.5px;font-weight:700;line-height:1.3}
.scen button small{display:block;font-weight:600;color:var(--shell-muted);font-size:11.5px;margin-top:2px}
.scen button:hover{box-shadow:inset 0 0 0 1.5px var(--shell-ink)}
.seg{display:flex;background:var(--shell-bg);border-radius:10px;padding:3px;margin-bottom:8px}
.seg button{flex:1;padding:7px 4px;border-radius:8px;font-size:12px;font-weight:700;color:var(--shell-muted)}
.seg button.on{background:var(--panel);color:var(--shell-ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seglbl{font-size:12px;color:var(--shell-muted);margin:4px 0}
.note{background:var(--shell-bg);border-radius:14px;padding:14px;font-size:13px;line-height:1.5}
.note b{display:block;font-size:13.5px;margin-bottom:4px}
.fab{display:none}
@media (max-width: 860px){
  .stage{padding:0;gap:0;height:100%}
  .phone{width:100%;height:100%;min-height:100dvh;border-radius:0;box-shadow:none}
  body{height:100%}
  .panel{position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;border-radius:20px 20px 0 0;max-height:80%;overflow:auto;z-index:100;transform:translateY(105%);transition:transform .25s;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
  .panel.open{transform:none}
  .fab{display:flex;position:fixed;right:14px;bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:90;background:#F2F4F8;color:#0F1629;border-radius:999px;padding:10px 14px;font-size:13px;font-weight:800;box-shadow:0 6px 18px rgba(0,0,0,.4)}
}
</style>
</head>
<body>
<div class="stage">
  <div class="phone" id="phone"></div>
  <aside class="panel" id="panel" aria-label="Prototype controls">
    <div class="row between" style="display:flex;justify-content:space-between;align-items:center"><h2>Driver app controls</h2><button class="link" id="closePanel" style="display:none;color:#2F5BD3">Close</button></div>
    <p>Ola HER, driver side. Women drivers choose who they ride with, or keep driving for everyone as usual. <a href="https://mrinmoyee1998.github.io/Ola-HER-Prototype/rider.html">Open the rider app</a></p>
    <div class="psec"><b>Scenarios</b>
      <div class="scen">
        <button data-scn="1">1. Set ride preference<small>Any, prefer, or women only</small></button>
        <button data-scn="2">2. HER request<small>Rider asked for a woman driver</small></button>
        <button data-scn="3">3. Prefer mode, none nearby<small>Regular request, no penalty</small></button>
        <button data-scn="4">4. Women only, quiet area<small>Honest idle fallback</small></button>
        <button data-scn="5">5. Any rider (opt out)<small>Operates exactly as today</small></button>
        <button data-scn="6">6. Driver safety<small>Mid-trip safety tools</small></button>
      </div>
    </div>
    <div class="psec"><b>Conditions</b>
      <div class="seglbl">Driver</div>
      <div class="seg" data-ctl="driverKey"><button data-v="priya">Priya (woman)</button><button data-v="arjun">Arjun (man)</button></div>
      <div class="seglbl">Women riders requesting nearby</div>
      <div class="seg" data-ctl="womenNearby"><button data-v="yes">Yes</button><button data-v="no">No</button></div>
      <div class="seglbl">Time of day</div>
      <div class="seg" data-ctl="night"><button data-v="day">Day</button><button data-v="night">Night</button></div>
    </div>
    <div class="psec"><b>Why this screen exists</b><div class="note" id="note"></div></div>
    <div class="psec"><button class="link" data-reset style="color:#2F5BD3">Reset prototype</button></div>
  </aside>
  <button class="fab" id="fab">Demo controls</button>
</div>

<script>
/* =========================================================
   Ola HER — Driver app prototype (mock data, no backend)
   ========================================================= */
const P = {
  shield:'<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>',
  shieldCheck:'<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/>',
  share:'<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/>',
  phone:'<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>',
  star:'<polygon points="12 2 15.1 8.3 22 9.3 17 14.1 18.2 21 12 17.8 5.8 21 7 14.1 2 9.3 8.9 8.3 12 2"/>',
  home:'<path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  pin:'<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',
  left:'<path d="m15 18-6-6 6-6"/>', right:'<path d="m9 18 6-6-6-6"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  headset:'<path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3"/>',
  car:'<path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9L18 10l-2.7-3.6A2 2 0 0 0 13.7 6H7.4a2 2 0 0 0-1.8 1.1L4 10l-1.6.5C1.6 10.8 1 11.6 1 12.5V16c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/><path d="M9 17h6"/>',
  wallet:'<path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/>',
  sliders:'<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
  nav:'<polygon points="3 11 22 2 13 21 11 13 3 11"/>',

  back:'<path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>'
};
const I = (n, s = 20, extra = '') => `<svg class="ic" ${extra} width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;

/* ---------- Mock data ---------- */
const DRIVERS = {
  priya:{ name:'Priya Sharma', first:'Priya', initials:'P', woman:true, car:'White Tata Nexon', plate:'KA 05 XX 1234', rating:4.9 },
  arjun:{ name:'Arjun Nair', first:'Arjun', initials:'A', woman:false, car:'Grey Maruti WagonR', plate:'KA 03 MK 7781', rating:4.8 }
};
const RIDERS = {
  aditi:{ name:'Aditi', initials:'A', woman:true, rating:4.8, rides:48, pickup:'Koramangala 5th Block', drop:'Indiranagar, 100 Feet Road', fare:245, dist:'7.2 km', pickupMin:3 },
  karan:{ name:'Karan', initials:'K', woman:false, rating:4.7, rides:112, pickup:'Forum Mall, Koramangala', drop:'MG Road Metro', fare:228, dist:'6.4 km', pickupMin:4 }
};
const MODES = {
  any:   { t:'Any rider', d:'Receive every trip request, exactly as you do today.', rate:[6,8], short:'Any rider' },
  prefer:{ t:'Prefer women riders', d:'Women riders near you are offered to you first. When none are nearby you get regular requests, and declining them never affects your acceptance rate.', rate:[6,8], short:'Women riders preferred' },
  only:  { t:'Women riders only', d:'You only receive requests from women riders. Expect fewer requests and longer gaps between trips.', rate:[2,4], short:'Women riders only' }
};
const HER_BONUS = 30;

/* ---------- State ---------- */
const initial = () => ({
  screen:'home', history:[], driverKey:'priya', womenNearby:'yes', night:true,
  online:false, searching:false, idle:false, request:null, countdown:15,
  prefs:{ mode:'prefer', when:'night', herOptIn:true, checkins:true, autoShare:true }, draft:null,
  stage:'pickup', progress:0, otp:'', otpBad:false, sheet:null,
  earnings:1840, trips:9, herTrips:12, lastFare:0, lastBonus:0, rating:0, safe:null, sosArm:0
});
let S = initial();
let timers = [];
const later = (fn, ms) => timers.push(setTimeout(fn, ms));
const every = (fn, ms) => timers.push(setInterval(fn, ms));
const clearTimers = () => { timers.forEach(t => { clearTimeout(t); clearInterval(t); }); timers = []; };

const DRV = () => DRIVERS[S.driverKey];
const time = () => S.night ? '10:42' : '2:15';
/* Preferences apply only to women drivers, and only within the chosen time window */
const prefActive = () => DRV().woman && (S.prefs.when === 'always' || S.night);
const effMode = () => prefActive() ? S.prefs.mode : 'any';

function go(screen, opts = {}) {
  clearTimers();
  if (!opts.replace && S.screen !== screen) S.history.push(S.screen);
  S.screen = screen; S.sheet = null; render(); enter(screen);
}
function back() { clearTimers(); S.screen = S.history.pop() || 'home'; S.sheet = null; render(); enter(S.screen); }
function enter(screen) {
  if (screen === 'home' && S.online && !S.request && !S.idle) startSearch();
  if (screen === 'home' && S.request) startCountdown();
  if (screen === 'trip') startDriving();
}

/* ---------- Dispatch simulation ---------- */
function startSearch() {
  S.searching = true; S.idle = false; S.request = null; render();
  const mode = effMode(); const d = DRV(); const women = S.womenNearby === 'yes';
  later(() => {
    if (S.screen !== 'home' || !S.online) return;
    if (women) {
      // Women drivers opted into HER see HER-preference requests; others get Aditi as a regular trip.
      const her = d.woman && S.prefs.herOptIn;
      S.request = { rider:'aditi', her, outside:false, showGender: d.woman && mode !== 'any' || her };
    } else if (mode === 'only') {
      S.searching = false; S.idle = true; render(); return;
    } else {
      S.request = { rider:'karan', her:false, outside: mode === 'prefer', showGender:false };
    }
    S.searching = false; render(); startCountdown();
  }, women ? 2600 : 3600);
}
function startCountdown() {
  S.countdown = 15;
  every(() => {
    if (!S.request) return;
    S.countdown--;
    const t = document.getElementById('cd'); const ring = document.getElementById('cdring');
    if (t) t.textContent = S.countdown;
    if (ring) ring.setAttribute('stroke-dashoffset', (1 - S.countdown / 15) * 138);
    if (S.countdown <= 0) { clearTimers(); S.request = null; toast('Request expired'); startSearch(); }
  }, 1000);
}

/* ---------- Driving simulation ---------- */
const PICKUP_PATH = 'M310 330 L200 330 L80 330 L80 420';
const RIDE_PATH = 'M80 420 L80 330 L200 330 L200 180 L310 180 L310 70';
function startDriving() {
  positionCar();
  every(() => {
    if (S.screen !== 'trip' || S.sheet || S.stage === 'otp' || S.stage === 'arrived') return;
    S.progress = Math.min(1, S.progress + (S.stage === 'pickup' ? 0.02 : 0.009));
    positionCar();
    if (S.progress >= 1) {
      if (S.stage === 'pickup') { S.stage = 'arrived'; render(); }
      else if (S.stage === 'ride') { S.stage = 'dropoff'; render(); }
    }
  }, 110);
}
function positionCar() {
  const path = document.getElementById('track'); const car = document.getElementById('car');
  if (!path || !car) return;
  const pt = path.getPointAtLength(S.progress * path.getTotalLength());
  car.setAttribute('transform', `translate(${pt.x.toFixed(1)},${pt.y.toFixed(1)})`);
  const eta = document.getElementById('eta');
  if (eta) eta.textContent = Math.max(1, Math.ceil((1 - S.progress) * (S.stage === 'pickup' ? 3 : 14))) + ' min';
}

/* ---------- Map ---------- */

    <rect x="96" y="346" width="90" height="60" rx="8" fill="var(--block)"/><ellipse cx="40" cy="150" rx="70" ry="54" fill="var(--water)"/>

    ${zones ? (women
      ? `<circle class="zone" cx="120" cy="380" r="62"/><circle class="zone-ring" cx="120" cy="380" r="62"/><circle class="zone" cx="250" cy="120" r="48"/><circle class="zone-ring" cx="250" cy="120" r="48"/>
         <text class="maplabel" x="78" y="455" style="fill:var(--her)">HER DEMAND</text>`
      : `<circle class="zone" cx="360" cy="40" r="34" style="opacity:.14"/><circle class="zone-ring" cx="360" cy="40" r="34"/><text class="maplabel" x="268" y="92" style="fill:var(--her)">NEAREST: 3.4 KM</text>`) : ''}
    ${path ? `<path id="track" class="route" d="${path}"/>` : ''}
    ${path === RIDE_PATH ? `<circle cx="310" cy="70" r="9" fill="#F2F4F8"/><rect x="306" y="66" width="8" height="8" fill="#0F1629"/>` : ''}

/* ---------- Shared pieces ---------- */
const statusBar = () => `<div class="sb"><b>${time()}</b><span class="row" style="gap:6px"><span class="sig"><i style="height:4px"></i><i style="height:7px"></i><i style="height:10px"></i><i style="height:12px"></i></span><span style="font-size:12px">5G</span></span></div>`;
const topbar = t => `<div class="topbar"><button class="iconbtn" data-a="back" aria-label="Back">${I('left')}</button><h1>${t}</h1></div>`;
const sw = (on, a, cls = '') => `<button class="switch ${cls} ${on ? 'on' : ''}" data-a="${a}" role="switch" aria-checked="${on}" aria-label="Toggle"></button>`;
const tabbar = active => `<nav class="tabbar">
  ${[['home','home','Drive'],['earnings','wallet','Earnings'],['network','gift','HER Network'],['account','user','Account']].map(([k,i,l]) =>
    `<button class="tab ${active===k?'on':''}" data-a="${k==='earnings'?'toast':'tab'}" data-v="${k==='earnings'?'Earnings detail is outside this prototype\u2019s scope':k}">${I(i,22)}${l}</button>`).join('')}

function modeSummary() {
  const d = DRV();

  return { title:m.short, sub: prefActive() ? (S.prefs.when === 'night' ? 'Active now until 6 AM' : 'Active all day') : 'Starts at 9 PM. Any rider until then.' };

      ${S.stage==='arrived' ? `<button class="btn btn-primary" style="margin-top:14px" data-a="openOtp">Rider is here, enter OTP</button>` : ''}
      ${S.stage==='ride' ? `<button class="btn btn-line" style="margin-top:14px;height:50px" data-a="toast" data-v="Opening navigation…">${I('nav',18)}Navigate</button>` : ''}
      ${S.stage==='dropoff' ? `<button class="btn btn-go" style="margin-top:14px" data-a="endTrip">End trip and collect ₹${r.fare + (q.her?HER_BONUS:0)}</button>` : ''}
    </div>
  </div>
  ${S.stage==='otp' ? otpSheet() : ''}
  ${S.sheet==='safety' ? safetySheet() : ''}
</div>`;
};
function otpSheet() {
  const digits = S.otp.padEnd(4,' ').split('');
  return `<div class="overlay"><div class="sheet"><div class="grab"></div><div class="pad">
    <h2 class="h2">Enter trip OTP</h2><p class="sub">Ask ${RIDERS[S.request.rider].name} for her 4-digit code. Demo code: 4821.</p>
    <div class="otpboxes ${S.otpBad?'bad':''}">${digits.map(d=>`<i>${d.trim()}</i>`).join('')}</div>
    <div class="keys">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-a="key" data-v="${n}">${n}</button>`).join('')}
      <button data-a="otpCancel" style="font-size:14px">Cancel</button><button data-a="key" data-v="0">0</button><button data-a="key" data-v="del" aria-label="Delete">${I('back',20,'style="margin:auto"')}</button></div>
  </div></div></div>`;
}
function safetySheet() {
  return `<div class="overlay" data-a="closeSheet" data-self><div class="sheet" role="dialog" aria-label="Driver safety"><div class="grab"></div><div class="pad">
    <h2 class="h2">Your safety</h2>
    <button class="sos-big" style="margin-top:12px" data-a="armSos"><span class="ring">SOS</span><span><b>Emergency</b><span>Alerts Ola Safety and your family with live location</span></span></button>
    <div style="margin-top:8px">
      <div class="srow">${I('share',20)}<span class="grow"><b>Share trip with family</b><span>Live location until the trip ends</span></span>${sw(S.prefs.autoShare,'toggleShare','green')}</div>
      <div class="srow">${I('clock',20)}<span class="grow"><b>Night check-ins</b><span>A quick "All okay?" every 30 min after 9 PM</span></span>${sw(S.prefs.checkins,'toggleCheckins','green')}</div>
      <div class="srow">${I('verified',20)}<span class="grow"><b>Rider verified</b><span>Phone verified, ${RIDERS[S.request.rider].rides} completed rides</span></span></div>
      <button class="srow" data-a="toast" data-v="Connecting you to Ola Driver Safety (24×7)…">${I('headset',20)}<span class="grow"><b>Call Ola Driver Safety</b><span>Trained agent, 24×7</span></span>${I('right',18)}</button>
    </div>
    <button class="btn btn-line" style="margin-top:8px" data-a="closeSheet">Back to trip</button>
  </div></div>
  ${S.sosArm ? `<div class="overlay" style="align-items:center;padding:18px;z-index:30"><div class="sheet" style="border-radius:22px;padding:22px;text-align:center">
     <div style="font-size:54px;font-weight:800;color:var(--sos)">${S.sosArm}</div><h2 class="h2">Sending emergency alert</h2>
     <p class="sub">Ola Safety and your family will get your live location.</p>
     <button class="btn btn-line" style="margin-top:16px" data-a="cancelSos">Cancel, I'm safe</button></div></div>` : ''}
  </div>`;
}

SCREENS.sos = () => `
<div class="screen sos-screen">${statusBar()}
  <div class="scroll pad" style="padding-top:10px">
    <div class="sos-pulse">${I('shield',58)}</div>
    <h2 class="h2" style="text-align:center;font-size:24px">Emergency alert sent</h2>
    <p class="sub" style="text-align:center;color:rgba(255,255,255,.85)">Stay on this screen if you can. Help is being coordinated.</p>
    <div class="sos-list">
      <div>${I('check',18)}Ola Driver Safety alerted. An agent will call you.</div>
      <div>${I('check',18)}Live location sent to your family</div>
      <div>${I('check',18)}Trip and rider details shared</div>
      <div>${I('mic',18)}In-car audio recording started</div>
    </div>
    <button class="btn" style="background:#fff;color:#9E1F1B;margin-top:18px" data-a="toast" data-v="Calling 112 (prototype: no real call is placed)">${I('phone',18)}Call 112</button>
    <button class="btn" style="color:#fff;margin:14px 0 24px;text-decoration:underline" data-a="safeNow">I'm safe now</button>
  </div></div>`;

/* Trip complete */
SCREENS.complete = () => {
  const r = RIDERS[S.request.rider];
  return `
<div class="screen">${statusBar()}
  <div class="scroll pad" style="padding-top:8px">
    <div style="width:56px;height:56px;border-radius:50%;background:var(--safe-soft);color:var(--safe);display:grid;place-items:center">${I('check',28)}</div>
    <h2 class="h2" style="margin-top:14px;font-size:24px">Trip complete</h2>
    <div class="fareline" style="margin-top:8px"><b>₹${S.lastFare + S.lastBonus}</b><span class="small">collected in cash</span></div>
    ${S.lastBonus ? `<div class="banner her">${I('gift',16)}<span>Includes ₹${S.lastBonus} HER bonus. ${S.herTrips}/20 HER trips this week toward your ₹600 weekly bonus.</span></div>` : ''}
    <div class="group" style="margin:18px 0 0;text-align:center">
      <b>Rate ${r.name}</b>
      <div class="stars">${[1,2,3,4,5].map(n=>`<button class="${S.rating>=n?'on':''}" data-a="rate" data-v="${n}" aria-label="${n} stars">${I('star',32,S.rating>=n?'fill="currentColor"':'')}</button>`).join('')}</div>
    </div>
    <div style="margin-top:20px"><b style="font-size:15.5px">Did you feel safe on this trip?</b>
      <div class="choice">${['Yes','Somewhat','No'].map((c,i)=>`<button class="${S.safe===i?'on':''}" data-a="safe" data-v="${i}">${c}</button>`).join('')}</div>
      ${S.safe>=1 ? `<div class="banner warn">${I('info',16)}<span class="grow">You can report what happened privately. It won't affect your rating.</span><button class="link" data-a="toast" data-v="Report sent to Ola Driver Safety" style="font-size:13px">Report</button></div>` : ''}
    </div>
    <button class="btn btn-go" style="margin:22px 0 26px" data-a="finish">Back online</button>
  </div></div>`;
};

/* HER Network — supply-side incentives */
SCREENS.network = () => {
  const d = DRV();
  return `
<div class="screen">${statusBar()}
  <div class="topbar"><h1>HER Network</h1></div>
  <div class="scroll">
    ${!d.woman ? `<div class="pad"><div class="banner info" style="margin-top:0">${I('info',16)}<span>HER Network supports women drivers. You can still help: refer a woman you know and earn ₹1,000 when she completes 50 trips.</span></div></div>` : `
    <div class="group">
      <div class="row between"><h3>This week's HER bonus</h3><span class="badge her">₹600</span></div>
      <div class="progressbar"><i style="width:${S.herTrips/20*100}%"></i></div>
      <p class="small" style="margin:8px 0 0">${S.herTrips} of 20 HER trips. Plus ₹${HER_BONUS} on every HER trip, paid by Ola, not the rider.</p>
    </div>
    <div class="group">
      <div class="row between"><h3>Pilot earnings floor</h3><span class="badge safe">On tonight</span></div>
      <p class="small" style="margin:8px 0 0">If you stay online in a HER demand zone from 9 PM to 1 AM, Ola tops up your earnings to at least ₹300 per online hour. Pilot terms; amount is illustrative.</p>
    </div>`}
    <div class="group">
      <div class="srow">${I('book',20)}<span class="grow"><b>Women Driver Academy</b><span>Safety and self-defence session, Saturday 10 AM, Koramangala hub</span></span><button class="link" data-a="toast" data-v="Registered for Saturday's Academy session">Register</button></div>
      <div class="srow">${I('bolt',20)}<span class="grow"><b>EV lease for women drivers</b><span>Low deposit, weekly payments (pilot)</span></span><button class="link" data-a="toast" data-v="An Ola financing partner will call you">Apply</button></div>
      <div class="srow">${I('users',20)}<span class="grow"><b>Refer a woman driver</b><span>₹1,000 when she completes 50 trips</span></span><button class="link" data-a="toast" data-v="Referral link copied">Share</button></div>
      <div class="srow">${I('clock',20)}<span class="grow"><b>Reserved HER trips</b><span>3 corporate late-shift riders booked ahead for tonight, 11 PM–12 AM</span></span><button class="link" data-a="toast" data-v="Tonight's reserved HER trips added to your schedule">View</button></div>
    </div>
  </div>
  ${tabbar('network')}
</div>`;
};

SCREENS.account = () => `
<div class="screen">${statusBar()}
  <div class="topbar"><h1>Account</h1></div>
  <div class="scroll">
    <div class="row pad" style="margin-bottom:16px"><div class="avatar ${DRV().woman?'f':''}">${DRV().initials}</div><div><b style="font-size:18px">${DRV().name}</b><div class="small">${DRV().car}, ${DRV().plate}</div></div></div>
    <div class="group" style="padding:4px 16px">
      <button class="srow" data-a="go" data-v="prefs">${I('sliders',20)}<span class="grow"><b>Ride preferences</b><span>${modeSummary().title}</span></span>${I('right',18)}</button>
      <button class="srow" data-a="toast" data-v="Documents are outside this prototype\u2019s scope">${I('verified',20)}<span class="grow"><b>Documents</b><span>Licence, RC, insurance verified</span></span>${I('right',18)}</button>
    </div>
  </div>
  ${tabbar('account')}
</div>`;

/* =========================================================
   Actions
   ========================================================= */
const A = {
  back, go: v => go(v), tab: v => go(v, { replace:true }),
  goOnline: () => { S.online = true; render(); startSearch(); },
  goOffline: () => { clearTimers(); S.online = false; S.searching = false; S.idle = false; S.request = null; render(); },
  decline: () => { const outside = S.request.outside; clearTimers(); S.request = null; toast(outside ? "Declined. Your acceptance rate isn't affected." : 'Request declined'); startSearch(); },
  accept: () => { S.stage = 'pickup'; S.progress = 0; S.otp = ''; go('trip', { replace:true }); },
  openOtp: () => { S.stage = 'otp'; S.otp = ''; render(); },
  otpCancel: () => { S.stage = 'arrived'; render(); },
  key: v => {
    S.otpBad = false;
    if (v === 'del') S.otp = S.otp.slice(0,-1); else if (S.otp.length < 4) S.otp += v;
    render();
    if (S.otp.length === 4) {
      if (S.otp === '4821') { S.stage = 'ride'; S.progress = 0; render(); positionCar(); toast('OTP verified. Trip started.'); }
      else { S.otpBad = true; render(); later(() => { S.otp = ''; S.otpBad = false; if (S.stage==='otp') render(); }, 700); }
    }
  },
  endTrip: () => {
    const r = RIDERS[S.request.rider];
    S.lastFare = r.fare; S.lastBonus = S.request.her ? HER_BONUS : 0;
    if (S.request.her) S.herTrips++;
    S.earnings += S.lastFare + S.lastBonus; S.trips++;
    go('complete', { replace:true });
  },
  rate: v => { S.rating = +v; render(); },
  safe: v => { S.safe = +v; render(); },
  finish: () => { S.request = null; S.rating = 0; S.safe = null; S.history = []; S.online = true; go('home', { replace:true }); toast('Thanks for the feedback'); },
  openSafety: () => { S.sheet = 'safety'; render(); },
  closeSheet: () => { S.sheet = null; render(); positionCar(); },
  toggleShare: () => { S.prefs.autoShare = !S.prefs.autoShare; render(); },
  toggleCheckins: () => { S.prefs.checkins = !S.prefs.checkins; render(); },
  armSos: () => {
    S.sosArm = 3; render();
    const tick = () => { if (!S.sosArm) return; S.sosArm--; if (S.sosArm <= 0) { S.sosArm = 0; go('sos'); } else { render(); later(tick, 1000); } };
    later(tick, 1000);
  },
  cancelSos: () => { S.sosArm = 0; render(); toast('Emergency alert cancelled'); },
  safeNow: () => { S.sheet = null; back(); toast('Marked safe. Ola Driver Safety will still follow up.'); },
  headToZone: () => { toast('Navigating to Indiranagar HER zone'); S.idle = false; S.womenNearby = 'yes'; startSearch(); },
  switchPrefer: () => { S.prefs.mode = 'prefer'; S.idle = false; toast('Switched to Prefer women riders'); startSearch(); },
  keepWaiting: () => { S.idle = false; startSearch(); },
  mode: v => { draft(); S.draft.mode = v; render(); },
  when: v => { draft(); S.draft.when = v; render(); },
  herOptIn: () => { draft(); S.draft.herOptIn = !S.draft.herOptIn; render(); },
  savePrefs: () => {
    if (S.draft) S.prefs = S.draft; S.draft = null;
    S.idle = false; S.request = null;
    back(); toast(`Saved: ${MODES[S.prefs.mode].short}`);
  },
  toast: v => toast(v)
};
function draft() { if (!S.draft) S.draft = JSON.parse(JSON.stringify(S.prefs)); }

/* =========================================================
   Render + events
   ========================================================= */
const phone = document.getElementById('phone');
function render() {
  phone.classList.toggle('day', !S.night);
  if (S.screen !== 'prefs') S.draft = null;
  phone.innerHTML = SCREENS[S.screen]() + `<div class="toast" id="toast" role="status"></div>`;
  if (S.screen === 'trip') positionCar();
  syncPanel();
}
let toastT;
function toast(msg) {
  const el = document.getElementById('toast'); if (!el) return;
  el.innerHTML = I('check',16) + `<span>${msg}</span>`; el.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 2600);
}
phone.addEventListener('click', e => {
  const t = e.target.closest('[data-a]'); if (!t) return;
  if (t.hasAttribute('data-self') && e.target !== t) return;
  const fn = A[t.dataset.a]; if (fn) fn(t.dataset.v);
});

/* ---------- Presenter panel ---------- */
const NOTES = {
  home:['Drive home','The mode card shows which preference is active and when. Going online starts dispatch under that rule. Women drivers see HER demand zones on the map so they can position for women riders.'],
  prefs:['The driver-side choice','Three modes. "Any rider" keeps the job exactly as today. "Prefer" adds priority with no earnings cliff. "Women only" is honest about fewer requests. Each shows an estimated request rate, mirroring the rider’s wait meter.'],
  trip:['Same trip, extra cover','The pickup, OTP and drop flow is unchanged. Safety tools sit one tap away, with night check-ins and family sharing for drivers too.'],
  complete:['Earnings and safety feedback','The HER bonus is itemised so the incentive is visible. The safety question gives drivers a private reporting path.'],
  network:['HER Network: building supply','Women Driver Academy, HER bonuses, a pilot earnings floor, EV financing, referrals and corporate reserved trips. These are the levers that make rider-side matching reliable.'],
  account:['Account','Ride preferences are also reachable here.'],
  sos:['Driver SOS','Same emergency pattern as the rider app, routed to a driver safety desk.']
};
function syncPanel() {
  document.querySelectorAll('[data-ctl]').forEach(seg => {
    const k = seg.dataset.ctl; const val = k === 'night' ? (S.night ? 'night' : 'day') : S[k];
    seg.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === val));
  });
  let n = NOTES[S.screen] || ['',''];
  if (S.screen === 'home' && S.request) n = S.request.her
    ? ['HER request','The rider asked for a woman driver. The request is labelled and carries a bonus, because these are the trips that make HER reliable for riders.']
    : S.request.outside
      ? ['Outside preference, no penalty','"Prefer" never strands a driver. When no women riders are nearby she still gets work, and can decline it freely.']
      : ['Regular request','Normal dispatch. Rider gender is only shown to women drivers who chose a preference.'];
  if (S.screen === 'home' && S.idle) n = ['Honest idle state','“Women only” can mean waiting. Instead of silence, the app shows where demand is and offers a softer mode. It mirrors the rider’s “no woman driver” screen.'];
  if (S.screen === 'prefs' && !DRV().woman) n = ['Non-HER drivers unchanged','Male drivers keep the standard flow and never see rider gender. HER adds options without taking anything away from anyone.'];
  document.getElementById('note').innerHTML = `<b>${n[0]}</b>${n[1]}`;
}
document.querySelectorAll('[data-ctl] button').forEach(b => b.addEventListener('click', () => {
  const k = b.parentElement.dataset.ctl;
  if (k === 'night') S.night = b.dataset.v === 'night'; else S[k] = b.dataset.v;
  if (k === 'driverKey' && S.screen === 'network') { render(); return; }
  if (S.screen === 'home' && S.online && !S.request) { clearTimers(); startSearch(); } else render();
}));
function scenario(n) {
  clearTimers();
  const keep = { night:S.night };
  S = Object.assign(initial(), keep);
  if (n === 1) { S.history = ['home']; S.screen = 'prefs'; render(); }
  if (n === 2) { S.prefs.mode = 'only'; S.prefs.when = 'always'; S.womenNearby = 'yes'; S.online = true; render(); startSearch(); }
  if (n === 3) { S.prefs.mode = 'prefer'; S.prefs.when = 'always'; S.womenNearby = 'no'; S.online = true; render(); startSearch(); }
  if (n === 4) { S.prefs.mode = 'only'; S.prefs.when = 'always'; S.womenNearby = 'no'; S.online = true; render(); startSearch(); }
  if (n === 5) { S.prefs.mode = 'any'; S.womenNearby = 'yes'; S.prefs.herOptIn = false; S.online = true; render(); startSearch(); }
  if (n === 6) { S.request = { rider:'aditi', her:true, outside:false, showGender:true }; S.stage = 'ride'; S.progress = .35; S.online = true; S.history = ['home']; S.screen = 'trip'; render(); enter('trip'); S.sheet = 'safety'; render(); }
  closePanel();
}
document.querySelectorAll('[data-scn]').forEach(b => b.addEventListener('click', () => scenario(+b.dataset.scn)));
document.querySelector('[data-reset]').addEventListener('click', () => { clearTimers(); S = initial(); render(); closePanel(); });
const panel = document.getElementById('panel'), fab = document.getElementById('fab'), closeBtn = document.getElementById('closePanel');
fab.addEventListener('click', () => { panel.classList.add('open'); closeBtn.style.display = 'block'; });
closeBtn.addEventListener('click', closePanel);
function closePanel(){ panel.classList.remove('open'); closeBtn.style.display = 'none'; }

render();
</script>
</body>
</html>
